name: firmware
on:
  push:
    paths:
      - "firmware/**"
      - "Makefile"
      - "mise.toml"
      - "silabs/**"
      - "scripts/generate"
      - "scripts/xiao-generated-overrides.patch"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "Makefile"
      - "mise.toml"
      - "silabs/**"
      - "scripts/generate"
      - "scripts/xiao-generated-overrides.patch"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:
concurrency:
  group: firmware-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
          install: true
          cache: true
          experimental: true
      - name: Cache Silicon Labs SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .silabs-home
          key: silabs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('silabs/pkg.lock') }}
      - name: Install Silicon Labs SDK
        run: mise run setup:silabs
      - name: Verify generated project
        run: |
          mise run generate
          git diff --exit-code -- \
            firmware/autogen/sl_component_catalog.h \
            firmware/autogen/sl_event_handler.c \
            firmware/autogen/sl_power_manager_handler.c \
            firmware/config/end-device-support-config.h \
            firmware/config/network-steering-config.h \
            firmware/config/sl_board_control_config.h \
            firmware/config/sl_mx25_flash_shutdown_eusart_config.h \
            firmware/config/sl_power_manager_config.h \
            firmware/config/sl_rail_util_rf_path_switch_config.h \
            firmware/config/sl_rail_util_pti_config.h \
            firmware/config/sl_zigbee_debug_print_config.h
      - name: Test state detector
        run: mise run test
      - name: Build firmware
        run: mise run build
      - name: Build diagnostic firmware
        run: mise run build:debug
