[settings]
experimental = true

[tools]
actionlint = "1.7.12"
checkmake = "0.3.2"
clang = "23.1.0"
clang-format = "23.1.0"
"conda:clang-tools" = "23.1.0"
prek = "0.4.9"
shellcheck = "0.11.0"
shfmt = "3.13.1"
tombi = "1.5.1"
yamlfmt = "0.21.0"

[tools."http:slt"]
version = "1.2.3"
bin_path = "."
# Silicon Labs' CDN rejects mise's CI User-Agent. Use the wget
# User-Agent documented for headless SLT installation.
headers = { "User-Agent" = "Wget/1.21.3" }

[tools."http:slt".platforms]
macos-arm64 = { url = "https://www.silabs.com/documents/public/software/slt-cli-1.2.3-mac-arm64.zip", checksum = "sha256:0b7518ad5311a171b5887f076d31259e5b78b001cd1942166358378bb84d82fb" }
linux-x64 = { url = "https://www.silabs.com/documents/public/software/slt-cli-1.2.3-linux-x64.zip", checksum = "sha256:62d87094379b88781bd24e681ad41ffd1e89e572d099d518e92947ebec117796" }

[tools."http:openocd"]
version = "0.12.0-arduino1-static"
bin_path = "bin"
strip_components = 1

[tools."http:openocd".platforms]
macos-arm64 = { url = "https://downloads.arduino.cc/tools/openocd-0.12.0-arduino1-static-x86_64-apple-darwin19.tar.bz2", checksum = "sha256:098def8648d19a98f437c2b9458743bd78e6093b6883b67d52262dd73482ce31" }
linux-x64 = { url = "https://downloads.arduino.cc/tools/openocd-0.12.0-arduino1-static-x86_64-ubuntu16.04-linux-gnu.tar.bz2", checksum = "sha256:c48b4b348a68c3394e29fb7469a9eadf815a029e223b1612faff86bf4e7f053c" }

[env]
SILABS_HOME = "{{config_root}}/.silabs-home"

[tasks."setup:silabs"]
description = "Install the Silicon Labs SDK and compiler"
run = "HOME=$SILABS_HOME slt --non-interactive install --no-lock --file silabs/pkg.lock"

[tasks.setup]
description = "Set up the development environment and Git hooks"
depends = ["setup:silabs"]
run = "prek install"

[tasks.test]
description = "Run host-side unit tests"
run = "make test"

[tasks.format]
description = "Format source and repository files"
run = [
  "clang-format -i firmware/src/*.[ch] firmware/tests/*.[ch]",
  "tombi format --offline mise.toml prek.toml silabs/pkg.slt silabs/pkg.lock",
  "yamlfmt .github/workflows/*.yml",
]

[tasks."format:check"]
description = "Check source and repository formatting"
run = [
  "clang-format --dry-run --Werror firmware/src/*.[ch] firmware/tests/*.[ch]",
  "tombi format --offline --check mise.toml prek.toml silabs/pkg.slt silabs/pkg.lock",
  "yamlfmt -lint .github/workflows/*.yml",
]

[tasks.lint]
description = "Run repository linters"
run = "prek run --all-files"

[tasks.build]
description = "Build the XIAO MG24 firmware"
run = "make firmware"

[tasks."build:debug"]
description = "Build the XIAO MG24 firmware with diagnostics enabled"
run = "make firmware-debug"

[tasks.flash]
description = "Build and flash the connected XIAO MG24"
run = "make flash"

[tasks."flash:debug"]
description = "Build and flash diagnostic firmware"
run = "make flash-debug"

[tasks.check]
description = "Run formatting, lint, tests, and the firmware build"
depends = ["lint", "test", "build"]

[tasks.generate]
description = "Regenerate Silicon Labs project files from the SLCP manifest"
run = "scripts/generate"

[tasks.monitor]
description = "Open the serial console (set PORT and BAUD as needed)"
run = "make monitor"

[tasks.clean]
description = "Remove firmware and host-test build products"
run = "make clean"
